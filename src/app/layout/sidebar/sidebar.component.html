<aside class="sidebar bg-white border-end">
  <div class="p-3 border-bottom">
    <div class="small text-uppercase text-muted fw-semibold">Navigation</div>
  </div>

  <div class="p-3">
    <div *ngIf="currentUser$ | async as currentUser" class="mb-4">
      <div class="small text-muted mb-1">Signed in as</div>
      <div class="fw-semibold">{{ currentUser.primaryRole }}</div>
      <div class="small text-muted">{{ currentUser.bankName }}</div>
    </div>

    <ul *ngIf="currentUser$ | async as currentUser" class="nav nav-pills flex-column gap-2">
      <li
        *ngFor="let item of getAllowedMenuItems(currentUser); trackBy: trackByRoute"
        class="nav-item"
      >
        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          class="nav-link d-flex align-items-center justify-content-between"
        >
          <span>{{ item.label }}</span>
          <span class="badge text-bg-light border">></span>
        </a>
      </li>
    </ul>
  </div>
</aside>
