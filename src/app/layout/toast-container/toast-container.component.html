<div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1200">
  <div *ngFor="let toast of toastService.toasts()" 
       class="toast show align-items-center text-white border-0 mb-2" 
       [class.bg-success]="toast.type === 'success'"
       [class.bg-danger]="toast.type === 'danger'"
       [class.bg-warning]="toast.type === 'warning'"
       [class.bg-info]="toast.type === 'info'"
       role="alert" aria-live="assertive" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">
        <strong *ngIf="toast.title" class="me-auto d-block mb-1">{{ toast.title }}</strong>
        {{ toast.message }}
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" 
              (click)="toastService.remove(toast)" aria-label="Close"></button>
    </div>
  </div>
</div>
