<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-lg border-0 rounded-4 animate__animated animate__fadeIn">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <div class="bg-primary-soft rounded-circle d-inline-flex p-3 mb-3">
              <i class="bi bi-shield-lock-fill text-primary h3 mb-0"></i>
            </div>
            <h2 class="fw-bold text-dark">Security Update</h2>
            <p class="text-muted">Change your account password to keep it secure.</p>
          </div>

          <form (ngSubmit)="onSubmit()" #passwordForm="ngForm">
            <!-- Alert Messages -->
            <div *ngIf="errorMsg" class="alert alert-danger border-0 small animate__animated animate__shakeX">
              <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ errorMsg }}
            </div>
            <div *ngIf="successMsg" class="alert alert-success border-0 small animate__animated animate__fadeIn">
              <i class="bi bi-check-circle-fill me-2"></i> {{ successMsg }}
            </div>

            <div class="mb-3">
              <label class="form-label small text-uppercase fw-bold text-muted">Current Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key"></i></span>
                <input 
                  type="password" 
                  name="currentPassword"
                  class="form-control bg-light border-start-0 ps-0" 
                  placeholder="Enter current password"
                  [(ngModel)]="currentPassword"
                  required
                >
              </div>
            </div>

            <hr class="my-4 opacity-50">

            <div class="mb-3">
              <label class="form-label small text-uppercase fw-bold text-muted">New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                <input 
                  type="password" 
                  name="newPassword"
                  class="form-control bg-light border-start-0 ps-0" 
                  placeholder="At least 8 characters"
                  [(ngModel)]="newPassword"
                  required
                >
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label small text-uppercase fw-bold text-muted">Confirm New Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-check"></i></span>
                <input 
                  type="password" 
                  name="confirmPassword"
                  class="form-control bg-light border-start-0 ps-0" 
                  placeholder="Repeat new password"
                  [(ngModel)]="confirmPassword"
                  required
                >
              </div>
            </div>

            <div class="d-grid gap-2 mt-4">
              <button 
                type="submit" 
                class="btn btn-primary btn-lg fw-bold text-uppercase py-3" 
                [disabled]="isSubmitting || !passwordForm.valid"
              >
                <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm me-2"></span>
                Update Password
              </button>
              <button type="button" class="btn btn-link text-muted fw-bold text-decoration-none" (click)="passwordForm.reset()">
                Clear Form
              </button>
            </div>
          </form>
        </div>
      </div>
      
      <div class="text-center mt-4">
        <a routerLink="/dashboard" class="text-secondary text-decoration-none small fw-bold">
          <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
        </a>
      </div>
    </div>
  </div>
</div>
