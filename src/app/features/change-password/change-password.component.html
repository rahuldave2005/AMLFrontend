<div class="change-password-container">
  <div class="change-password-card">
    <div class="card-header">
      <div class="icon-circle">
        <i class="bi bi-shield-lock"></i>
      </div>
      <h2>Update Password</h2>
      <p class="subtitle">For security, you must change your password on your first login.</p>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="password-form">
      <!-- Current Password -->
      <div class="form-group">
        <label for="currentPassword">Current Password</label>
        <div class="input-wrapper">
          <i class="bi bi-key"></i>
          <input 
            type="password" 
            id="currentPassword" 
            formControlName="currentPassword" 
            placeholder="Enter current password"
            [class.is-invalid]="hasError('currentPassword', 'required')"
          >
        </div>
        <div class="error-message" *ngIf="hasError('currentPassword', 'required')">
          Current password is required.
        </div>
      </div>

      <!-- New Password -->
      <div class="form-group">
        <label for="newPassword">New Password</label>
        <div class="input-wrapper">
          <i class="bi bi-lock"></i>
          <input 
            type="password" 
            id="newPassword" 
            formControlName="newPassword" 
            placeholder="Min 8 characters"
            [class.is-invalid]="hasError('newPassword', 'required') || hasError('newPassword', 'minlength')"
          >
        </div>
        <div class="error-message" *ngIf="hasError('newPassword', 'required')">
          New password is required.
        </div>
        <div class="error-message" *ngIf="hasError('newPassword', 'minlength')">
          Password must be at least 8 characters long.
        </div>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <div class="input-wrapper">
          <i class="bi bi-lock-check"></i>
          <input 
            type="password" 
            id="confirmPassword" 
            formControlName="confirmPassword" 
            placeholder="Repeat new password"
            [class.is-invalid]="hasError('confirmPassword', 'required') || hasError('confirmPassword', 'passwordMismatch')"
          >
        </div>
        <div class="error-message" *ngIf="hasError('confirmPassword', 'required')">
          Please confirm your new password.
        </div>
        <div class="error-message" *ngIf="hasError('confirmPassword', 'passwordMismatch')">
          Passwords do not match.
        </div>
      </div>

      <!-- Status Messages -->
      <div class="alert alert-danger" *ngIf="errorMsg">
        <i class="bi bi-exclamation-triangle"></i> {{ errorMsg }}
      </div>
      <div class="alert alert-success" *ngIf="successMsg">
        <i class="bi bi-check-circle"></i> {{ successMsg }}
      </div>

      <button type="submit" class="btn-submit" [disabled]="isSubmitting || passwordForm.invalid">
        <span *ngIf="!isSubmitting">Update Password</span>
        <span *ngIf="isSubmitting" class="spinner-border spinner-border-sm" role="status"></span>
      </button>
    </form>
  </div>
</div>
