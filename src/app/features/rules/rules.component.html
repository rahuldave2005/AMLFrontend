<div class="card app-card border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h5 mb-1">Rules</h2>
        <p class="text-muted mb-0">Monitoring rules available to authorized roles</p>
      </div>
      <button type="button" class="btn btn-outline-primary">Create Rule</button>
    </div>

    <div class="row g-3">
      <div class="col-12 col-md-6" *ngFor="let rule of rules; trackBy: trackByName">
        <div class="border rounded-3 p-3 h-100">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <h3 class="h6 mb-0">{{ rule.name }}</h3>
            <span class="badge" [ngClass]="rule.status === 'Active' ? 'text-bg-success' : 'text-bg-warning'">
              {{ rule.status }}
            </span>
          </div>
          <p class="text-muted small mb-0">Owner: {{ rule.owner }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
