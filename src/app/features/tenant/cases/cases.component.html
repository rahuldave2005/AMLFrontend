<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h3 fw-bold text-gray-800">Case Dashboard</h2>
      <p class="text-muted">Manage investigations and case assignments.</p>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light text-dark small text-uppercase fw-bold">
            <tr>
              <th class="px-4 py-3">Reference Number</th>
              <th class="px-4 py-3">Assigned To</th>
              <th class="px-4 py-3 text-center">Status</th>
              <th class="px-4 py-3 text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <ng-container *ngIf="cases$ | async as cases; else loading">
              <tr *ngFor="let caseItem of cases">
                <td class="px-4 py-3">
                  <span class="fw-bold text-dark">{{ caseItem.caseReferenceNumber }}</span>
                </td>
                <td class="px-4 py-3">
                  <div class="d-flex align-items-center">
                    <div class="avatar-sm bg-light rounded-circle d-flex align-items-center justify-content-center me-2">
                      <i class="bi bi-person text-primary"></i>
                    </div>
                    <span class="text-dark fw-medium">{{ caseItem.assignedTo }}</span>
                  </div>
                </td>
                <td class="px-4 py-3 text-center">
                  <span class="badge" [ngClass]="getStatusClass(caseItem.caseStatus)">
                    {{ caseItem.caseStatus }}
                  </span>
                </td>
                <td class="px-4 py-3 text-end">
                  <a [routerLink]="[caseItem.caseReferenceNumber]" class="btn btn-sm btn-outline-primary fw-bold">
                    <i class="bi bi-search me-1"></i> Investigation
                  </a>
                </td>
              </tr>
              <tr *ngIf="cases.length === 0">
                <td colspan="4" class="text-center py-5">
                  <div class="text-muted">
                    <i class="bi bi-folder2-open display-4 d-block mb-3 opacity-25"></i>
                    No cases found.
                  </div>
                </td>
              </tr>
            </ng-container>
            <ng-template #loading>
              <tr>
                <td colspan="4" class="text-center py-5">
                  <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                  <span class="text-muted">Loading cases...</span>
                </td>
              </tr>
            </ng-template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
