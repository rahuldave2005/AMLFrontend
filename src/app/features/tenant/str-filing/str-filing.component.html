<div class="container-fluid p-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="h3 fw-bold text-gray-800">STR Filings</h2>
      <p class="text-muted">View and manage all Suspicious Transaction Reports filed.</p>
    </div>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light text-dark small text-uppercase fw-bold">
            <tr>
              <th class="px-4 py-3">Reference Number</th>
              <th class="px-4 py-3">Case Number</th>
              <th class="px-4 py-3" *ngIf="!isComplianceOfficer">Filed By</th>
              <th class="px-4 py-3 text-end">Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngIf="isLoading">
              <td colspan="4" class="text-center py-5">
                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                <span class="text-muted">Loading filings...</span>
              </td>
            </tr>

            <ng-container *ngIf="!isLoading">
              <tr *ngFor="let filing of filings">
                <td class="px-4 py-3">
                  <span class="fw-bold text-dark">{{ filing.referenceNumber }}</span>
                </td>
                <td class="px-4 py-3">
                  <span class="text-primary fw-medium text-dark">{{ filing.caseNumber }}</span>
                </td>
                <td class="px-4 py-3 text-secondary text-dark" *ngIf="!isComplianceOfficer">
                  {{ filing.filedBy }}
                </td>
                <td class="px-4 py-3 text-end">
                  <a [routerLink]="[filing.referenceNumber]" class="btn btn-sm btn-outline-primary fw-bold">
                    <i class="bi bi-eye-fill me-1"></i> View Details
                  </a>
                </td>
              </tr>
              <tr *ngIf="filings.length === 0">
                <td colspan="4" class="text-center py-5">
                  <div class="text-muted">
                    <i class="bi bi-file-earmark-text display-4 d-block mb-3 opacity-25"></i>
                    No STR filings found.
                  </div>
                </td>
              </tr>
            </ng-container>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Pagination Footer -->
    <div class="card-footer bg-white border-0 p-3">
      <div class="d-flex justify-content-between align-items-center">
        <div class="text-muted small">
          Page <strong>{{ currentPage + 1 }}</strong>
        </div>
        <div class="btn-group">
          <button class="btn btn-sm btn-outline-secondary px-3" [disabled]="currentPage === 0 || isLoading"
            (click)="prevPage()">
            <i class="bi bi-chevron-left me-1"></i> Previous
          </button>
          <button class="btn btn-sm btn-outline-secondary px-3" [disabled]="isLastPage || isLoading"
            (click)="nextPage()">
            Next <i class="bi bi-chevron-right ms-1"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
