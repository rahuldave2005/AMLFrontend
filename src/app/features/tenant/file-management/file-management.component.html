<div class="container-fluid p-4">
  <!-- Header Section -->
  <div class="d-flex justify-content-between align-items-end mb-4">
    <div>
      <h2 class="h3 fw-bold text-gray-800 mb-1">File Management</h2>
      <p class="text-muted mb-0">View and manage uploaded files.</p>
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="text-center py-5">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
    <p class="text-muted mt-2">Loading files...</p>
  </div>

  <!-- File Table -->
  <div *ngIf="!isLoading" class="card shadow-sm border-0 rounded-4 overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="bg-light text-dark small text-uppercase fw-bold">
          <tr>
            <th class="px-4 py-3">File Number</th>
            <th class="px-4 py-3">File Name</th>
            <th class="px-4 py-3 text-center">Type</th>
            <th class="px-4 py-3">Upload Date</th>
            <th class="px-4 py-3 text-end">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let file of files" class="border-bottom">
            <td class="px-4 py-3">
              <span class="fw-bold text-dark">{{ file.fileNumber }}</span>
            </td>
            <td class="px-4 py-3">
              <span class="text-primary fw-medium text-dark">{{ file.fileName }}</span>
            </td>
            <td class="px-4 py-3 text-center">
              <span class="badge bg-secondary-soft text-secondary border text-dark">
                {{ file.fileType }}
              </span>
            </td>
            <td class="px-4 py-3 text-secondary text-dark">
              {{ file.uploadDate | date:'mediumDate' }}
            </td>
            <td class="px-4 py-3 text-end">
              <a [routerLink]="['/file-management', file.fileNumber]" class="btn btn-sm btn-outline-primary fw-bold">
                <i class="bi bi-eye-fill me-1"></i> View Details
              </a>
            </td>
          </tr>
          
          <tr *ngIf="files.length === 0">
            <td colspan="5" class="text-center py-5">
              <div class="text-muted">
                <i class="bi bi-folder-x display-4 d-block mb-3 opacity-50"></i>
                No files found.
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="card-footer bg-white border-top p-3" *ngIf="files.length > 0">
      <div class="d-flex justify-content-between align-items-center">
        <span class="text-muted small">
          Showing page {{ currentPage + 1 }}
        </span>
        <div class="btn-group shadow-sm">
          <button 
            class="btn btn-outline-secondary btn-sm px-3" 
            [disabled]="currentPage === 0" 
            (click)="prevPage()">
            <i class="bi bi-chevron-left"></i> Previous
          </button>
          <button 
            class="btn btn-outline-secondary btn-sm px-3" 
            [disabled]="isLastPage" 
            (click)="nextPage()">
            Next <i class="bi bi-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
