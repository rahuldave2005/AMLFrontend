<div class="row g-4">
  <div class="col-12" *ngFor="let alert of alerts; trackBy: trackByTitle">
    <div class="card app-card border-0">
      <div class="card-body">
        <div class="d-flex justify-content-between align-items-start gap-3">
          <div>
            <h2 class="h6 mb-1">{{ alert.title }}</h2>
            <p class="text-muted mb-0">{{ alert.description }}</p>
          </div>
          <span
            class="badge"
            [ngClass]="{
              'text-bg-danger': alert.severity === 'High',
              'text-bg-warning': alert.severity === 'Medium',
              'text-bg-success': alert.severity === 'Low'
            }"
          >
            {{ alert.severity }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>
