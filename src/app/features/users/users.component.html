<div class="card app-card border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h5 mb-1">Users</h2>
        <p class="text-muted mb-0">User access overview by role</p>
      </div>
      <button type="button" class="btn btn-primary">Add User</button>
    </div>

    <div class="list-group list-group-flush">
      <div
        *ngFor="let user of users; trackBy: trackByName"
        class="list-group-item px-0 d-flex justify-content-between align-items-center"
      >
        <div>
          <div class="fw-medium">{{ user.name }}</div>
          <div class="text-muted small">{{ user.role }}</div>
        </div>
        <span class="badge" [ngClass]="user.status === 'Active' ? 'text-bg-success' : 'text-bg-warning'">
          {{ user.status }}
        </span>
      </div>
    </div>
  </div>
</div>
