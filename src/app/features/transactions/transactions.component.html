<div class="card app-card border-0">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h2 class="h5 mb-1">Transactions</h2>
        <p class="text-muted mb-0">Recent activity snapshot</p>
      </div>
      <button type="button" class="btn btn-primary">New Review</button>
    </div>

    <div class="table-responsive">
      <table class="table align-middle mb-0">
        <thead>
          <tr>
            <th>Transaction ID</th>
            <th>Customer</th>
            <th>Amount</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let transaction of transactions; trackBy: trackById">
            <td>{{ transaction.id }}</td>
            <td>{{ transaction.customer }}</td>
            <td>{{ transaction.amount }}</td>
            <td>
              <span
                class="badge"
                [ngClass]="{
                  'text-bg-success': transaction.status === 'Reviewed',
                  'text-bg-warning': transaction.status === 'Pending',
                  'text-bg-danger': transaction.status === 'Escalated'
                }"
              >
                {{ transaction.status }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
