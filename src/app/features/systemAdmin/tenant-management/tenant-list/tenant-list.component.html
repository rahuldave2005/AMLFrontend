<div class="table-responsive bg-white rounded shadow-sm">
  <table class="table table-hover align-middle mb-0">
    <thead class="bg-light">
      <tr>
        <th class="px-4 py-3 text-uppercase small fw-bold text-muted text-nowrap">Bank Name</th>
        <th class="px-4 py-3 text-uppercase small fw-bold text-muted text-nowrap">IFSC</th>
        <th class="px-4 py-3 text-uppercase small fw-bold text-muted text-nowrap">Contact Email</th>
        <th class="px-4 py-3 text-uppercase small fw-bold text-muted text-end">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let tenant of tenants">
        <td class="px-4 py-3">
          <div class="fw-semibold text-dark">{{ tenant.bankName }}</div>
        </td>
        <td class="px-4 py-3 text-muted">{{ tenant.ifsc }}</td>
        <td class="px-4 py-3 text-muted">{{ tenant.contactEmail }}</td>
        <td class="px-4 py-3 text-end">
          <button (click)="onViewDetails.emit(tenant.bankName)" 
                  class="btn btn-sm btn-outline-primary rounded-pill px-3 transition-btn">
            View Details
          </button>
        </td>
      </tr>
      <tr *ngIf="tenants.length === 0">
        <td colspan="4" class="text-center py-5 text-muted">
          <i class="bi bi-inbox fs-2 d-block mb-2"></i>
          No tenants found.
        </td>
      </tr>
    </tbody>
  </table>
</div>
